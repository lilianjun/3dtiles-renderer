name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes older runs on the same ref (each linux run does a
# full vcpkg build, so stacking them wastes a lot of CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# P4: every platform builds the real dependency set (no zero-dep stubs).
# - linux:   full deps (SDL3 demo + Cesium Native + Filament), xvfb-run ctest
# - windows: MSVC + Filament prebuilt (SDK static lib + linkcheck dylib link)
# - android: NDK r27d + Filament android prebuilt + Cesium Native
#           (SDK + linkcheck .so link + smoke APK with the real renderer)
# - ios:     macOS host, real iOS arm64 cross compile + Filament xcframework
# - wasm:    Emscripten cross compile of the SDK (stub: official Filament
#            v1.77.0 web release ships no C++ libs, see ADR-0006)

jobs:
  # ---------------------------------------------------------------- linux
  linux:
    name: Linux (gcc, full deps + xvfb tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 X11 video deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev \
            libc++-dev libc++abi-dev
      - name: Install Pillow (screenshot pixel assertions)
        run: pip3 install --user pillow numpy
      - name: Configure
        run: >
          cmake --preset linux
          -DTILES_WITH_SDL3=ON
          -DTILES_WITH_CESIUM_NATIVE=ON
          -DTILES_WITH_FILAMENT=ON
          -DTILES_SDL3_NATIVE_VIDEO=ON
          -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/tiles_sdk"
      - name: Build
        run: cmake --build --preset linux -j"$(nproc)"
      - name: Test (headless, Mesa software GL)
        # P19-hotfix: golden screenshots are bit-identical on one Mesa stack
        # but CI runners ship a different Mesa — observed 25-1389 differing
        # edge pixels (max 0.29%) vs the dev machine's baseline. The escape
        # hatch tolerates cross-Mesa rasterization variance; real regressions
        # still move tens of thousands of pixels. See tests/golden/README.md.
        env:
          GOLDEN_MAX_DIFF_FRAC: "0.005"
        run: xvfb-run -a ctest --preset linux --output-on-failure
      # P14: lock in P13's install packaging. Runs as steps in this job
      # (not a separate job) because the check needs the already-built
      # tree — a new job would redo the full dependency build for nothing.
      # The smoke binary only calls Renderer::version(): a pure function
      # needing no display, so it runs without xvfb. Rendering is already
      # covered by the ctest suite above.
      # NOTE: CMAKE_INSTALL_PREFIX is set at configure time (see above),
      # not just via --prefix at install time: cesium-native's per-library
      # install rules bake ${CMAKE_INSTALL_PREFIX} into absolute
      # destinations at configure time, so an install-time --prefix alone
      # leaves its headers targeting /usr/local/include (permission error
      # on CI, silent mis-install as root).
      - name: Install SDK to temp prefix
        run: cmake --install build/linux --prefix "${RUNNER_TEMP}/tiles_sdk"
      - name: Install smoke test (external consumer)
        run: |
          cmake -S tests/install_smoke -B "${RUNNER_TEMP}/smoke-build" \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/tiles_sdk"
          cmake --build "${RUNNER_TEMP}/smoke-build" -j"$(nproc)"
          "${RUNNER_TEMP}/smoke-build/install_smoke"

  # -------------------------------------------------------- linux-asan
  # P6: sanitizer gate — the same scenarios as the linux job, rebuilt with
  # -fsanitize=address,undefined on our own targets only. Fails on any
  # ASan/UBSan/LSan report. Runs as its own job so it doesn't slow the
  # plain linux test job.
  linux-asan:
    name: Linux sanitizers (ASan+LSan+UBSan gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 X11 video deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev \
            libc++-dev libc++abi-dev
      - name: Install Pillow (screenshot pixel assertions)
        run: pip3 install --user pillow numpy
      - name: Configure
        run: cmake --preset linux-asan
      - name: Build
        run: cmake --build --preset linux-asan -j"$(nproc)"
      - name: Test (sanitized scenarios, headless)
        run: xvfb-run -a ctest --preset linux-asan --output-on-failure

  # -------------------------------------------------------------- windows
  windows:
    name: Windows (MSVC + Filament)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: cmake --version
      - name: Configure
        # No -G: the preset leaves the generator unset so CMake picks the
        # newest installed Visual Studio (MinGW cannot link Filament's
        # MSVC-built .lib files).
        run: cmake --preset windows -DTILES_WITH_FILAMENT=ON
      - name: Build
        run: cmake --build --preset windows --config Release

  # -------------------------------------------------------------- android
  android:
    name: Android (NDK r27d + Filament)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
      - name: Install Android SDK (platform + build-tools)
        # The NDK step above covers native code; the smoke APK also needs
        # the Android SDK (aapt/d8/apksigner). Pinned cmdline-tools URL +
        # explicit packages keep this deterministic.
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" \
             "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Configure
        # nttld/setup-ndk exports ANDROID_NDK_HOME for the following steps;
        # the android preset auto-wires the NDK toolchain from it.
        # TILES_WITH_CESIUM_NATIVE=ON: without it the SDK builds as a stub
        # ("built without cesium-native + Filament") and the smoke APK can
        # never load a tileset (found by the first on-device run, 2026-09-30).
        run: cmake --preset android -DTILES_WITH_FILAMENT=ON -DTILES_WITH_CESIUM_NATIVE=ON
      - name: Build
        # Builds the SDK, the linkcheck .so, and libsmoke_jni.so for the
        # smoke APK (added by the top-level CMake, same invocation).
        run: cmake --build --preset android -j"$(nproc)"
      - name: Stage JNI libs for the smoke APK
        # Gradle consumes the JNI lib as a prebuilt jniLib (no NDK compile
        # inside Gradle). The android preset uses c++_shared, so the NDK's
        # libc++_shared.so must be packaged too.
        run: |
          mkdir -p samples/android-smoke/app/src/main/jniLibs/arm64-v8a
          cp build/android/libsmoke_jni.so \
             samples/android-smoke/app/src/main/jniLibs/arm64-v8a/
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             samples/android-smoke/app/src/main/jniLibs/arm64-v8a/
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Build smoke APK
        working-directory: samples/android-smoke
        run: gradle assembleDebug --no-daemon
      - name: Upload smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-apk
          path: samples/android-smoke/app/build/outputs/apk/debug/app-debug.apk

  # ----------------------------------------------------------------- ios
  ios:
    name: iOS (arm64 cross + Filament)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ios -DTILES_WITH_FILAMENT=ON
      - name: Build
        run: cmake --build --preset ios -j"$(sysctl -n hw.ncpu)"

  # ---------------------------------------------------------------- wasm
  wasm:
    name: WebAssembly (Emscripten SDK stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - name: Configure
        run: cmake --preset wasm
      - name: Build
        run: cmake --build --preset wasm -j"$(nproc)"
