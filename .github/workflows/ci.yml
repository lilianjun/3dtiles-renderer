name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes older runs on the same ref (each linux run does a
# full vcpkg build, so stacking them wastes a lot of CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# P4: every platform builds the real dependency set (no zero-dep stubs).
# - linux:   full deps (SDL3 demo + Cesium Native + Filament), xvfb-run ctest
# - windows: MSVC + Filament prebuilt (SDK static lib + linkcheck dylib link)
# - android: NDK r27d + Filament android prebuilt (SDK + linkcheck .so link)
# - ios:     macOS host, real iOS arm64 cross compile + Filament xcframework
# - wasm:    Emscripten cross compile of the SDK (stub: official Filament
#            v1.77.0 web release ships no C++ libs, see ADR-0006)

jobs:
  # ---------------------------------------------------------------- linux
  linux:
    name: Linux (gcc, full deps + xvfb tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 X11 video deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev \
            libc++-dev libc++abi-dev
      - name: Install Pillow (screenshot pixel assertions)
        run: pip3 install --user pillow numpy
      - name: Configure
        run: >
          cmake --preset linux
          -DTILES_WITH_SDL3=ON
          -DTILES_WITH_CESIUM_NATIVE=ON
          -DTILES_WITH_FILAMENT=ON
          -DTILES_SDL3_NATIVE_VIDEO=ON
      - name: Build
        run: cmake --build --preset linux -j"$(nproc)"
      - name: Test (headless, Mesa software GL)
        # P19-hotfix: golden screenshots are bit-identical on one Mesa stack
        # but CI runners ship a different Mesa — observed 25-1389 differing
        # edge pixels (max 0.29%) vs the dev machine's baseline. The escape
        # hatch tolerates cross-Mesa rasterization variance; real regressions
        # still move tens of thousands of pixels. See tests/golden/README.md.
        env:
          GOLDEN_MAX_DIFF_FRAC: "0.005"
        run: xvfb-run -a ctest --preset linux --output-on-failure
      # P14: lock in P13's install packaging. Runs as steps in this job
      # (not a separate job) because the check needs the already-built
      # tree — a new job would redo the full dependency build for nothing.
      # The smoke binary only calls Renderer::version(): a pure function
      # needing no display, so it runs without xvfb. Rendering is already
      # covered by the ctest suite above.
      - name: Install SDK to temp prefix
        run: cmake --install build/linux --prefix "${RUNNER_TEMP}/tiles_sdk"
      - name: Install smoke test (external consumer)
        run: |
          cmake -S tests/install_smoke -B "${RUNNER_TEMP}/smoke-build" \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/tiles_sdk"
          cmake --build "${RUNNER_TEMP}/smoke-build" -j"$(nproc)"
          "${RUNNER_TEMP}/smoke-build/install_smoke"

  # -------------------------------------------------------- linux-asan
  # P6: sanitizer gate — the same scenarios as the linux job, rebuilt with
  # -fsanitize=address,undefined on our own targets only. Fails on any
  # ASan/UBSan/LSan report. Runs as its own job so it doesn't slow the
  # plain linux test job.
  linux-asan:
    name: Linux sanitizers (ASan+LSan+UBSan gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 X11 video deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxss-dev libxtst-dev \
            libc++-dev libc++abi-dev
      - name: Install Pillow (screenshot pixel assertions)
        run: pip3 install --user pillow numpy
      - name: Configure
        run: cmake --preset linux-asan
      - name: Build
        run: cmake --build --preset linux-asan -j"$(nproc)"
      - name: Test (sanitized scenarios, headless)
        run: xvfb-run -a ctest --preset linux-asan --output-on-failure

  # -------------------------------------------------------------- windows
  windows:
    name: Windows (MSVC + Filament)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: cmake --version
      - name: Configure
        # No -G: the preset leaves the generator unset so CMake picks the
        # newest installed Visual Studio (MinGW cannot link Filament's
        # MSVC-built .lib files).
        run: cmake --preset windows -DTILES_WITH_FILAMENT=ON
      - name: Build
        run: cmake --build --preset windows --config Release

  # -------------------------------------------------------------- android
  android:
    name: Android (NDK r27d + Filament)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
      - name: Configure
        # nttld/setup-ndk exports ANDROID_NDK_HOME for the following steps;
        # the android preset auto-wires the NDK toolchain from it.
        run: cmake --preset android -DTILES_WITH_FILAMENT=ON
      - name: Build
        run: cmake --build --preset android -j"$(nproc)"

  # ----------------------------------------------------------------- ios
  ios:
    name: iOS (arm64 cross + Filament)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ios -DTILES_WITH_FILAMENT=ON
      - name: Build
        run: cmake --build --preset ios -j"$(sysctl -n hw.ncpu)"

  # ---------------------------------------------------------------- wasm
  wasm:
    name: WebAssembly (Emscripten SDK stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - name: Configure
        run: cmake --preset wasm
      - name: Build
        run: cmake --build --preset wasm -j"$(nproc)"
